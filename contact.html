<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — FreeMart</title>
<meta name="description" content="Get in touch with FreeMart — suggest a tool, report a broken link, or ask a question.">
<link rel="canonical" href="https://freemart.in/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .form-grid{display:grid;gap:16px;max-width:520px;margin-top:26px;}
  .form-grid label{font-size:.85rem;font-weight:600;display:block;margin-bottom:6px;}
  .form-grid input,.form-grid textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--paper);font-family:inherit;font-size:.95rem;color:var(--ink);
  }
  .form-grid textarea{min-height:120px;resize:vertical;}
  .form-grid input:focus,.form-grid textarea:focus{outline:none;border-color:var(--ink);}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">Free<span>Mart</span></a>
    <nav class="navlinks">
      <a href="tools.html">Tools</a>
      <a href="deals.html">Deals</a>
      <a href="guides.html">Guides</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<div class="page-head wrap">
  <h1>Contact</h1>
  <p>Suggest a tool, flag a broken link or expired deal, or ask a question.</p>
</div>

<div class="wrap split">
  <!--
    This form has no backend attached yet — a static HTML page can't send
    email on its own. Connect it to a free form service such as Formspree
    (formspree.io) or Web3Forms (web3forms.com): sign up, then replace the
    action="#" below with the endpoint they give you. Until then, use the
    direct email in the card beside this form.
  -->
  <form class="form-grid" action="#" method="post">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button class="btn btn-solid" type="submit" style="width:fit-content;">Send message</button>
  </form>

  <div class="contact-card">
    <h3>Reach us directly</h3>
    <a href="mailto:hello@freemart.in">hello@freemart.in</a>
    <a href="tools.html">Suggest a tool for the directory →</a>
    <a href="deals.html">Report an expired deal →</a>
  </div>
</div>

<footer class="foot-simple wrap">© 2026 FreeMart.in</footer>

</body>
</html>
